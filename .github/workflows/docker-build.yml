name: CI/CD Docker Build and Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 1. Build the image locally first (without pushing yet)
    - name: Build Docker Image for Testing
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: qr-code-generator:test

    # 2. Run pytest inside the container
    - name: Run Tests in Container
      run: |
        docker run --rm --entrypoint pytest qr-code-generator:test -o pythonpath=.

    # 3. Log in to Docker Hub (only runs if tests pass successfully)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    # 4. Push to Docker Hub after passing tests
    - name: Build and Push Final Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/qr-code-generator:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/qr-code-generator:${{ github.sha }}